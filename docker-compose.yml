services:
  db:
    image: postgres:17-alpine
    container_name: paltar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: paltar
      POSTGRES_PASSWORD: paltar
      POSTGRES_DB: paltar
    ports:
      - "5432:5432"
    volumes:
      - paltar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paltar -d paltar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paltar-db-data:
